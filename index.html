iv class="filter-chips">${['All','F1','Football','FC Barcelona','Cricket','Gaming','Music','Films'].map(x=>`<button class="chip-btn ${filter.topic===(x==='All'?'':x)?'selected':''}" data-action="topic" data-topic="${x==='All'?'':esc(x)}">${x}</button>`).join('')}</div></div><div class="section-head" style="margin-top:25px"><div><h2 id="discover-count">Explore profiles</h2><p>Fictional adult demo profiles · Filters work locally</p></div><button class="text-link" data-action="reset-filters">Clear filters ${i('x',13)}</button></div><div class="match-grid" id="discover-grid"></div>`}
function renderDiscoverGrid(){const q=filter.q.toLowerCase().trim();const matches=people.filter(p=>!isBlocked(p.id)&&p.age>=filter.ageMin&&p.age<=filter.ageMax&&(filter.city==='Any location'||p.city===filter.city)&&(filter.goal==='Any goal'||p.goal===filter.goal)&&(!filter.topic||[...p.interests,...p.teams,...p.communities.map(c=>communities.find(x=>x.id===c)?.short||'')].join(' ').toLowerCase().includes(filter.topic.toLowerCase()))&&(!q||[p.name,p.city,p.goal,...p.teams,...p.interests,...p.communities.map(c=>communities.find(x=>x.id===c)?.title||'')].join(' ').toLowerCase().includes(q))).sort((a,b)=>compatibility(b)-compatibility(a));const grid=document.querySelector('#discover-grid');if(grid)grid.innerHTML=matches.length?matches.map(matchCard).join(''):empty('Nobody in this orbit yet','Try widening the age range or clearing some filters.');const count=document.querySelector('#discover-count');if(count)count.textContent=`${matches.length} ${matches.length===1?'person':'people'} to discover`}
function communitiesPage(){return `${headline('Find your community','Your passions have a place here.','The best connections sometimes start with a matchday debate, a song recommendation, or a shared favorite film.')}<div class="featured-notice" style="margin-top:25px"><div><b>🌌 Belong before you connect.</b><p>Explore public demo discussions. Community participation never bypasses private-message consent.</p></div><span class="pill green">8 demo communities</span></div><div class="communities-grid">${communities.map(c=>`<article class="community-card" style="--glow:${c.glow}"><span class="community-emoji">${c.emoji}</span><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p><div class="tag-list"><span class="pill">${c.count} demo members</span><span class="pill">${c.discussions} discussions</span></div><div class="event">${i('calendar',12)} ${esc(c.event)}</div><div class="community-footer"><span>${joined.includes(c.id)?'✓ Joined in demo':'Your people are here'}</span><button class="btn btn-ghost btn-sm" data-action="community" data-id="${c.id}">Explore ${i('arrow',12)}</button></div></article>`).join('')}</div>`}
function messagesPage(){const connected=people.filter(p=>getStatus(p.id)==='connected'&&!isBlocked(p.id));const incoming=people.filter(p=>getStatus(p.id)==='incoming'&&!isBlocked(p.id));const outgoing=people.filter(p=>getStatus(p.id)==='outgoing'&&!isBlocked(p.id));if(chatTab==='chats'&&!connected.some(p=>p.id===activeChat))activeChat=connected[0]?.id||'';let list=chatTab==='chats'?connected.map(p=>`<button class="conversation-item ${p.id===activeChat?'active':''}" data-action="chat-open" data-id="${p.id}"><img class="chat-avatar" src="${avatar(p.id)}" alt=""><div class="convo-meta"><div class="line"><b>${esc(p.name)}</b><time>${p.id==='maya'?'Now':'Yesterday'}</time></div><p>${esc(chats[p.id]?.at(-1)?.text||'Say hello to start chatting')}</p></div></button>`).join(''):([...incoming.map(p=>`<div class="request-row"><img class="chat-avatar" src="${avatar(p.id)}" alt=""><div style="flex:1"><b>${esc(p.name)}</b><p>Wants to connect with you</p></div><div class="actions"><button class="btn btn-primary btn-sm" data-action="accept" data-id="${p.id}" aria-label="Accept ${esc(p.name)}">${i('check',12)}</button><button class="btn btn-ghost btn-sm" data-action="decline" data-id="${p.id}" aria-label="Decline ${esc(p.name)}">${i('x',12)}</button></div></div>`),...outgoing.map(p=>`<div class="request-row"><img class="chat-avatar" src="${avatar(p.id)}" alt=""><div style="flex:1"><b>${esc(p.name)}</b><p>Awaiting acceptance</p></div><button class="btn btn-ghost btn-sm" data-action="cancel" data-id="${p.id}">Cancel</button></div>`)].join(''));
const p=person(activeChat);const eligible=p&&getStatus(p.id)==='connected'&&!isBlocked(p.id);return `${headline('Conversations','A little hello goes a long way.','Your private messages are only available after mutual acceptance. These conversations are fictional, local demo content.')}<div class="messages-wrap ${mobileChatOpen?'mobile-chat-open':''}"><aside class="chat-list"><div class="chat-list-head"><h3>Messages <span class="pill violet" style="float:right">Demo inbox</span></h3><div class="chat-tabs"><button class="chat-tab ${chatTab==='chats'?'active':''}" data-action="chat-tab" data-tab="chats">Chats (${connected.length})</button><button class="chat-tab ${chatTab==='requests'?'active':''}" data-action="chat-tab" data-tab="requests">Requests (${incoming.length+outgoing.length})</button></div></div><div class="conversation-list">${list||empty(chatTab==='chats'?'No connections yet':'No pending requests',chatTab==='chats'?'Send a connection request on Discover.':'New requests will show up here.')}</div></aside><div class="chat-pane">${eligible?`<div class="chat-head"><button class="icon-btn mobile-back" data-action="mobile-chat-back" aria-label="Back to conversations">${i('back',17)}</button><img class="chat-avatar" src="${avatar(p.id)}" alt=""><div><h3>${esc(p.name)}</h3><span>${p.online?'● Demo online':'Demo profile'}</span></div><div class="spacer"></div><button class="icon-btn" data-action="profile-view" data-id="${p.id}" title="View profile" aria-label="View ${esc(p.name)} profile">${i('user',17)}</button><button class="icon-btn" data-action="safety-options" data-id="${p.id}" title="Safety options" aria-label="Safety options">${i('shield',17)}</button></div><div class="chat-history" id="chat-history"><div class="date-divider">This is a sample conversation. No live person is connected.</div>${(chats[p.id]||[]).map(m=>`<div class="chat-bubble ${m.from==='me'?'self':''}">${m.image?`<img src="${esc(m.image)}" alt="Image shared in demo chat">`:''}${m.text?`<div>${esc(m.text)}</div>`:''}<time>${esc(m.time)}</time></div>`).join('')}<div class="chat-typing" id="demo-typing" style="display:none">••• Typing indicator preview (not live)</div></div><div class="chat-compose"><input id="chat-file" type="file" accept="image/*" hidden><button class="icon-btn" data-action="upload-message-image" aria-label="Share image" title="Share image">${i('camera',18)}</button><button class="icon-btn" data-action="emoji" aria-label="Show emojis" title="Emoji">${i('smile',18)}</button><input id="message-input" class="input" placeholder="Write a kind message..." maxlength="2000" aria-label="Message text"><button class="btn btn-primary" data-action="send-message" aria-label="Send message">${i('send',18)}</button></div>${chatEmojiOpen?`<div style="display:flex;gap:8px;padding:3px 17px 12px">${['😊','💜','⚽','🏎️','✨','😂','🎬','🎧'].map(emoji=>`<button class="chip-btn" data-action="insert-emoji" data-emoji="${emoji}">${emoji}</button>`).join('')}</div>`:''}`:`<div class="chat-lock">${i('lock',45)}<h3>Your conversations are yours.</h3><p>Only you and people who have mutually accepted a connection can chat.</p><button class="btn btn-primary" data-action="navigate" data-page="discover">Discover people ${i('arrow',14)}</button></div>`}</div></div><div class="inline-alert" style="margin-top:14px">${i('info',13)} Demo mode: messages and connection requests remain in this browser. There is no real-time delivery, end-to-end encryption, or live moderation backend.</div>`}
function scrollChat(){const box=document.querySelector('#chat-history');if(box)box.scrollTop=box.scrollHeight}
function detail(label,value){return `<div class="detail-row"><span class="key">${label}</span><span class="value">${esc(value||'Not specified')}</span></div>`}
function profilePage(){const me=viewer();return `${headline('My profile','Your world, your story.','Let other adults know what makes you you — and be clear about what kind of connection you want.')}<div class="profile-layout"><div><div class="glass" style="overflow:hidden"><div class="profile-banner"></div><div class="profile-hero"><img src="${me.photo||avatar('sam')}" alt="${user?'Your profile photo':'Illustrated default demo avatar'}"><div><h2>${esc(me.name)}, ${me.age} ${user?'<span class="pill green">Demo profile saved</span>':'<span class="pill violet">Preview profile</span>'}</h2><p>${i('pin',12)} ${esc(me.city)} · ${esc(me.gender)}</p><div class="tag-list">${(me.teams||[]).slice(0,3).map(t=>`<span class="pill blue">${esc(t)}</span>`).join('')}</div></div></div></div><div class="panel" style="margin-top:17px"><h3>A little about me</h3><p>${esc(me.bio||'Add a bio to help spark conversations.')}</p><div class="tag-list">${(me.interests||[]).map(t=>`<span class="interest-tag">${esc(t)}</span>`).join('')}</div><div class="profile-actions"><button class="btn btn-primary" data-action="navigate" data-page="onboarding">${user?'Edit profile':'Create my real profile'} ${i('arrow',14)}</button><button class="btn btn-ghost" data-action="navigate" data-page="safety">Privacy controls ${i('shield',14)}</button></div></div></div><div class="panel"><h3>Connection intentions</h3>${detail('Relationship goal',me.goal)}${detail('Relationship status',me.status)}${detail('Interested in',me.interestedIn||'Everyone')}${detail('Location',me.city)}<div class="inline-alert" style="margin-top:18px">${i('shield',13)} Honest relationship status helps everyone make informed choices.</div><h3 style="margin-top:24px">Account safety</h3>${detail('Age eligibility','18+ self-declaration only')}${detail('Identity verified','Not verified in demo')}${detail('Email verified','Not verified in demo')}<button class="btn btn-ghost btn-sm" style="margin-top:12px" data-action="navigate" data-page="safety">Open Safety Center ${i('arrow',12)}</button></div></div>`}
function privacySetting(id,title,desc){return `<div class="setting-row"><div><b>${title}</b><p>${desc}</p></div><button class="toggle ${privacy[id]?'on':''}" data-action="privacy" data-setting="${id}" role="switch" aria-checked="${!!privacy[id]}" aria-label="${title}"><span></span></button></div>`}
function safetyPage(){return `${headline('Your safety matters','Stay safe in your sphere.','Consent, privacy and clear intentions are not extras. They are the foundation.')}<div class="safety-grid"><div><div class="panel"><h3>${i('shield',18)} Privacy controls</h3><p>Choose what you share and how you appear. These switches save locally in the preview.</p>${privacySetting('online','Show online status','Others can see when you are online.')}${privacySetting('discoverable','Show me in discovery','Opt in or out of appearing in search results.')}${privacySetting('invites','Allow community invitations','Choose whether communities can invite you.')}${privacySetting('receipts','Show read receipts','Share when a message is read after connecting.')}</div><div class="panel" style="margin-top:17px"><h3>Community guidelines</h3><ol class="guideline-list"><li>Only adults aged 18 and over may join.</li><li>Be genuine: no fake identities, impersonation, or deceptive profiles.</li><li>Respect boundaries. A declined request means no.</li><li>Never pressure someone into sharing intimate details, photos, or money.</li><li>Disclose relationship status and non-monogamous arrangements honestly.</li><li>No hate, harassment, threats, scams, or unsolicited sexual content.</li><li>Report suspicious or abusive behavior; blocking is always available.</li></ol></div></div><div><div class="panel"><h3>${i('lock',18)} Verification & protection</h3><div class="safety-action"><b>Age & identity checks</b><p>The demo checks birth date only. Actual launch requires a trusted age-assurance flow, identity review, and fraud safeguards.</p><span class="pill warning">Not verified · prototype</span></div><div class="safety-action"><b>Email / phone verification</b><p>Verification needs secure server-side OTP and abuse-rate limits; not connected here.</p><button class="btn btn-subtle btn-sm" data-action="verification-info">How it will work</button></div><div class="safety-action"><b>Report or block someone</b><p>Manage blocked demo profiles or report behavior. Reports are saved locally here, not sent to a moderator.</p><button class="btn btn-ghost btn-sm" data-action="blocked-list">Manage blocked (${blocked.length})</button></div><div class="safety-action"><b>Spam & scam protection</b><p>Launch checklist: rate limiting, anomaly detection, moderation queues, attachment scanning, and appeals.</p></div></div><div class="panel" style="margin-top:17px"><h3>Safer first-meeting tips</h3><p>Keep early conversations in-app, never share banking information, meet in public, tell someone you trust where you're going, and leave any situation that feels uncomfortable.</p><button class="btn btn-primary btn-sm" data-action="navigate" data-page="discover">Continue to discovery ${i('arrow',12)}</button></div></div></div>`}
function pricingPage(){return `${headline('Simple, transparent pricing','Meaningful connection is free.','The essentials stay free, including messaging, safety tools, and community access. No tricks and no ads inside private messages.')}<div class="price-grid"><div class="price-card featured"><span class="pill green">Available in concept</span><h3 style="margin-top:15px">MatchSphere Free</h3><p class="muted small">The entire foundation of connecting.</p><div class="price">₹0 <small>/ forever</small></div><ul><li>Create and manage your profile</li><li>Discover matches and communities</li><li>Send and approve connection requests</li><li>Message mutual connections</li><li>Block, report, and control your privacy</li><li>Clear relationship and status preferences</li></ul><button class="btn btn-primary" data-action="navigate" data-page="onboarding">Create a free profile ${i('arrow',14)}</button></div><div class="price-card"><span class="pill violet">Future idea · not for sale</span><h3 style="margin-top:15px">MatchSphere Plus</h3><p class="muted small">Optional nice-to-haves. Never essential safety.</p><div class="price">Coming soon</div><ul><li>More ways to customize your discovery experience</li><li>Advanced optional interest insights</li><li>Personalized profile themes</li><li>Extra community customization</li><li>No essential safety features behind a paywall</li></ul><button class="btn btn-ghost" data-action="premium-info">Learn more ${i('info',14)}</button></div></div><div class="section-head"><div><h2>Thoughtful advertising, never a distraction.</h2><p>Ads, if introduced, will be clearly labeled, limited, and kept outside private conversations.</p></div></div><div class="ad-example"><span class="ad-label">Sponsored · illustration only</span><div class="ad-preview"><div><h4>Community film night</h4><p>Example placement in public discovery spaces. This is not a real paid advertisement.</p></div><span style="font-size:30px">🎟️</span></div></div><p class="small muted" style="max-width:720px;margin-top:15px">Privacy promise for production: no sale of private messages to advertisers. Ad preferences and any targeting should use clear disclosure and consent.</p>`}
const field=(label,name,value,type='text',placeholder='',other='')=>`<div class="field"><label for="ob-${name}">${label}</label><input class="input" id="ob-${name}" data-onboard-field="${name}" type="${type}" value="${esc(value||'')}" placeholder="${esc(placeholder)}" ${other}></div>`;
const selectField=(label,name,options,current)=>`<div class="field"><label for="ob-${name}">${label}</label><select class="select" id="ob-${name}" data-onboard-field="${name}">${options.map(x=>`<option value="${esc(x)}" ${current===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
function onboardContent(){if(onboardingStep===0)return `<h2>First, the basics. 👋</h2><p>We want real people and real intentions. MatchSphere is exclusively for adults aged 18 and over.</p><div class="form-grid">${field('Your first name','name',draft.name,'text','What should we call you?','required maxlength="60"')}${field('Date of birth','dob',draft.dob,'date','','required')}${field('Email address','email',draft.email,'email','you@example.com','required')}${selectField('Your city','city',['Delhi','Mumbai','Bengaluru','Pune','Hyderabad','Other'],draft.city)}</div><div class="inline-alert">${i('shield',13)} This prototype only checks self-reported birth date. Secure third-party adult verification, email OTP, and identity checks are required before real launch.</div>`;
if(onboardingStep===1)return `<h2>Connections with clarity. 💜</h2><p>Be upfront about your relationship status, intentions, and who you hope to meet.</p><div class="form-grid">${selectField('Gender identity','gender',['','Woman','Man','Non-binary','Self-describe','Prefer not to say'],draft.gender)}${selectField('Interested in meeting','interestedIn',['Everyone','Women','Men','Non-binary people'],draft.interestedIn)}${selectField('Relationship goal','goal',goalOptions,draft.goal)}${selectField('Current relationship status','status',['Single','Separated','Divorced','Widowed','Partnered · openly non-monogamous'],draft.status)}</div><div class="inline-alert">${i('info',13)} Consensual non-monogamy is welcome only with honest disclosure and informed agreement. No secret relationships or deceptive behavior.</div>`;
if(onboardingStep===2)return `<h2>What makes your world yours? 🌍</h2><p>Choose your favorites. We use shared interests to make demo recommendations more relevant.</p><div class="field"><label>Interests (choose at least two)</label><div class="choice-grid">${interestOptions.map(x=>`<button class="choice ${draft.interests.includes(x)?'chosen':''}" data-action="draft-choice" data-field="interests" data-value="${esc(x)}" aria-pressed="${draft.interests.includes(x)}">${esc(x)}</button>`).join('')}</div></div><div class="field"><label>Favorite sports teams, clubs & communities</label><div class="choice-grid">${teamOptions.map(x=>`<button class="choice ${draft.teams.includes(x)?'chosen':''}" data-action="draft-choice" data-field="teams" data-value="${esc(x)}" aria-pressed="${draft.teams.includes(x)}">${esc(x)}</button>`).join('')}</div></div><div class="field"><label>Communities you'd like to join</label><div class="choice-grid">${communities.map(c=>`<button class="choice ${(draft.communities||[]).includes(c.id)?'chosen':''}" data-action="draft-choice" data-field="communities" data-value="${c.id}" aria-pressed="${(draft.communities||[]).includes(c.id)}">${c.emoji} ${esc(c.short)}</button>`).join('')}</div></div>`;
return `<h2>Make it yours. ✨</h2><p>A little introduction goes a long way. A photo is optional and is processed only in this browser.</p><div class="form-grid"><div class="field span-2"><label for="ob-bio">Your bio</label><textarea class="textarea" id="ob-bio" data-onboard-field="bio" maxlength="350" placeholder="What makes you, you?">${esc(draft.bio)}</textarea></div><div class="field span-2"><label>Profile photo (optional)</label><label class="upload-zone" for="profile-upload">${draft.photo?`<img class="upload-preview" src="${draft.photo}" alt="Your uploaded photo">`:i('camera',27)}<strong>${draft.photo?'Change your photo':'Choose a profile photo'}</strong>JPG, PNG or WEBP · stored locally in this preview<input type="file" accept="image/png,image/jpeg,image/webp" id="profile-upload"></label></div><div class="span-2"><label class="checkbox-field"><input type="checkbox" id="consent-box" ${draft.consent?'checked':''}> I am at least 18 and agree to communicate respectfully and state my relationship status honestly.</label></div></div>`}
function onboardingPage(){return `<div class="onboard-shell"><div class="eyebrow">YOUR JOURNEY STARTS HERE</div><h1 class="page-title">${user?'Refine your orbit.':'Create a profile that feels like you.'}</h1><p class="page-description">Free to join. Designed around intentions, interests and mutual respect.</p><div class="onboard-progress" aria-label="Step ${onboardingStep+1} of 4">${[0,1,2,3].map(s=>`<span class="${s<=onboardingStep?'done':''}"></span>`).join('')}</div><div class="onboard-card"><div class="pill violet" style="margin-bottom:18px">STEP ${onboardingStep+1} OF 4</div>${onboardContent()}<div class="onboard-footer"><button class="btn btn-ghost" data-action="onboard-prev">${i('back',14)} ${onboardingStep?'Back':'Cancel'}</button><span class="note">Your information stays in your browser in this preview.</span><button class="btn btn-primary" data-action="onboard-next">${onboardingStep===3?'Save my profile':'Continue'} ${i(onboardingStep===3?'check':'arrow',14)}</button></div></div></div>`}
function showProfile(id){const p=person(id);if(!p)return;currentModal='profile';const status=getStatus(id);openModal(`${modalHeader(`${esc(p.name)}, ${p.age}`)}<div class="modal-photo"><img src="${avatar(p.id)}" alt="Illustrated portrait of ${esc(p.name)}"></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:11px"><span class="pill green">${compatibility(p)}% demo compatibility</span><span class="pill blue">${i('pin',11)} ${esc(p.city)}</span>${p.online?'<span class="pill green">Demo online</span>':''}</div><p class="muted small">${esc(p.bio)}</p><div class="tag-list">${[...p.interests,...p.teams].map(x=>`<span class="interest-tag">${esc(x)}</span>`).join('')}</div><div class="why-match">${i('sparkle',12)} ${esc(why(p))}</div>${detail('Relationship intentions',p.goal)}${detail('Relationship status',p.status)}${detail('Communities',p.communities.map(x=>communities.find(c=>c.id===x)?.short).filter(Boolean).join(', '))}<div class="modal-actions" style="justify-content:space-between;flex-wrap:wrap"><div style="display:flex;gap:8px"><button class="btn btn-danger btn-sm" data-action="report" data-id="${id}">${i('flag',12)} Report</button><button class="btn btn-ghost btn-sm" data-action="block" data-id="${id}">${i('ban',12)} Block</button></div><button class="btn btn-primary btn-sm" data-action="connect" data-id="${id}">${status==='connected'?'Message':status==='outgoing'?'Request pending':status==='incoming'?'Accept request':'Connect'} ${i('arrow',12)}</button></div>`)}
function showCommunity(id){const c=communities.find(x=>x.id===id);if(!c)return;currentModal='community';openModal(`${modalHeader(`${c.emoji} ${esc(c.title)}`)}<p class="muted small">${esc(c.description)}</p><div class="tag-list"><span class="pill blue">${c.count} fictional demo members</span><span class="pill violet">${c.discussions} example discussions</span></div><div class="panel" style="padding:15px;margin:18px 0"><h3 style="margin-bottom:12px">Trending conversations</h3>${c.threads.map(t=>`<div class="thread"><b>${esc(t[0])}</b><small>${esc(t[1])}</small></div>`).join('')}</div><div class="pill green">${i('calendar',12)} ${esc(c.event)}</div><p class="note">Community discussion content and events are simulated. Public conversations do not authorize private messages.</p><div class="modal-actions"><button class="btn btn-ghost" data-action="close-modal">Close</button><button class="btn btn-primary" data-action="join" data-id="${id}">${joined.includes(id)?'Leave community':'Join community'} ${i('arrow',14)}</button></div>`)}
function showNotifications(){const incoming=people.filter(p=>getStatus(p.id)==='incoming'&&!isBlocked(p.id));openModal(`${modalHeader('Notifications')}<div class="pill violet">Prototype notifications</div>${incoming.length?incoming.map(p=>`<div class="request-row" style="margin-top:14px"><img class="chat-avatar" src="${avatar(p.id)}" alt=""><div style="flex:1"><b>${esc(p.name)} sent a request</b><p>Accept or decline to decide whether to chat</p></div><button class="btn btn-primary btn-sm" data-action="accept" data-id="${p.id}">Accept</button></div>`).join(''):'<p class="muted small">You’re all caught up on connection requests.</p>'}<div class="request-row" style="margin-top:12px"><span style="font-size:24px">✨</span><div><b>Welcome to MatchSphere</b><p>Real connections start with something you love.</p></div></div><button class="btn btn-ghost btn-sm" data-action="navigate" data-page="messages" style="margin-top:12px">Open messages ${i('arrow',12)}</button>`)}
function showSafetyOptions(id){openModal(`${modalHeader('Your safety options')}<p class="muted small">Manage your connection with ${esc(person(id)?.name||'this person')} at any time.</p><div class="modal-actions" style="justify-content:flex-start"><button class="btn btn-danger" data-action="report" data-id="${id}">${i('flag',14)} Report</button><button class="btn btn-ghost" data-action="block" data-id="${id}">${i('ban',14)} Block</button></div>`)}
function openReport(id){const p=person(id);currentModal='report';openModal(`${modalHeader(`Report ${esc(p?.name||'member')}`)}<p class="muted small">Tell us what happened. In this prototype, reports are recorded locally only, NOT sent to safety personnel.</p><div class="field"><label for="report-reason">Reason</label><select class="select" id="report-reason"><option>Harassment or unwanted contact</option><option>Fake profile or impersonation</option><option>Spam, financial scam or solicitation</option><option>Underage user suspected</option><option>Dishonest relationship disclosure</option><option>Hate speech or threatening behavior</option><option>Other safety concern</option></select></div><div class="field" style="margin-top:14px"><label for="report-details">Additional details (optional)</label><textarea class="textarea" id="report-details" maxlength="1200" placeholder="Describe the concern..."></textarea></div><div class="modal-actions"><button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-danger" data-action="submit-report" data-id="${id}">Save demo report ${i('flag',13)}</button></div>`)}
function openBlockConfirm(id){const p=person(id);currentModal='block';openModal(`${modalHeader(`Block ${esc(p?.name||'member')}?`)}<p class="muted small">They will no longer appear in your discovery feed or conversations. This is a local demo action.</p><div class="modal-actions"><button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-danger" data-action="confirm-block" data-id="${id}">Block profile</button></div>`)}
function showBlocked(){currentModal='blocked';openModal(`${modalHeader('Blocked profiles')}<p class="muted small">Blocked profiles cannot connect or appear in your demo discovery.</p>${blocked.length?blocked.map(id=>`<div class="request-row"><img class="chat-avatar" src="${avatar(id)}" alt=""><div style="flex:1"><b>${esc(person(id)?.name||'Unknown')}</b><p>Blocked locally</p></div><button class="btn btn-ghost btn-sm" data-action="unblock" data-id="${id}">Unblock</button></div>`).join(''):'<p class="muted small">No blocked profiles.</p>'}`)}
function actConnect(id){const p=person(id);if(!p||isBlocked(id))return;const s=getStatus(id);if(s==='connected'){activeChat=id;chatTab='chats';mobileChatOpen=true;closeModal();go('messages');return}if(s==='incoming'){connections[id]='connected';chats[id]=[{from:id,text:`Hey! Thanks for accepting. What's one thing you're excited about this week?`,time:'Demo'}];activeChat=id;chatTab='chats';mobileChatOpen=true;save();closeModal();toast(`You and ${p.name} are connected. You can now chat.`);go('messages');return}if(s==='outgoing'){toast(`Your connection request to ${p.name} is pending.`);return}connections[id]='outgoing';save();closeModal();render();toast(`Request sent to ${p.name}. Messaging unlocks only if they accept.`)}
function actDecline(id){connections[id]='declined';save();render();toast('Request declined. No conversation was opened.')}
function actCancel(id){delete connections[id];save();render();toast('Connection request cancelled.')}
function validateStep(){if(onboardingStep===0){if(!draft.name.trim()||draft.name.trim().length<2){toast('Please enter your name (at least 2 characters).');return false}if(!draft.dob){toast('Please enter your date of birth.');return false}const d=new Date(draft.dob+'T12:00:00');const today=new Date();let age=today.getFullYear()-d.getFullYear();if(today.getMonth()<d.getMonth()||(today.getMonth()===d.getMonth()&&today.getDate()<d.getDate()))age--;if(!Number.isFinite(age)||age<18||age>110){toast('MatchSphere is only for adults aged 18 and over.');return false}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(draft.email)){toast('Please enter a valid email address.');return false}}
if(onboardingStep===1){if(!draft.gender){toast('Please select your gender identity.');return false}if(draft.status==='Partnered · openly non-monogamous'&&draft.goal!=='Consensual non-monogamy'){toast('If you are currently partnered, select the consensual non-monogamy intention and disclose it clearly.');return false}}
if(onboardingStep===2&&draft.interests.length<2){toast('Please choose at least two interests.');return false}
if(onboardingStep===3&&!draft.consent){toast('Confirm that you are at least 18 and agree to the community guidelines.');return false}return true}
function beginOnboarding(){if(user){draft={...user,interests:[...user.interests],teams:[...user.teams],communities:[...(user.communities||[])],consent:false}}else{draft={name:'',dob:'',email:'',city:'Delhi',gender:'',interestedIn:'Everyone',goal:'Long-term relationship',status:'Single',interests:['Football','F1','Films'],teams:['FC Barcelona'],communities:[],bio:'',consent:false,photo:''}}onboardingStep=0;go('onboarding')}
function sendMessage(){const input=document.querySelector('#message-input');const text=(input?.value||'').trim();if(!text||!person(activeChat)||getStatus(activeChat)!=='connected'){return}if(text.length>2000){toast('Keep messages under 2,000 characters.');return}chats[activeChat] ||= [];chats[activeChat].push({from:'me',text,time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});save();chatEmojiOpen=false;render();toast('Saved in demo chat only — nothing was sent to a real person.');const typing=document.querySelector('#demo-typing');if(typing){typing.style.display='block';scrollChat();setTimeout(()=>{if(document.contains(typing))typing.style.display='none'},2300)}}
function imageForDemo(file,callback){if(!file||!file.type.startsWith('image/')){toast('Please select an image file.');return}if(file.size>6_000_000){toast('Choose an image smaller than 6 MB.');return}const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{const c=document.createElement('canvas');const scale=Math.min(1,500/image.width,500/image.height);c.width=Math.max(1,Math.round(image.width*scale));c.height=Math.max(1,Math.round(image.height*scale));c.getContext('2d').drawImage(image,0,0,c.width,c.height);callback(c.toDataURL('image/jpeg',.73))};image.src=reader.result};reader.readAsDataURL(file)}
function resetFilters(){filter={q:'',city:'Any location',goal:'Any goal',ageMin:22,ageMax:35,topic:''};render()}
function actionHandler(e){const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;if(a==='dismiss-backdrop'){if(e.target===el)closeModal();return}e.preventDefault();
if(a==='navigate'){closeModal();if(el.dataset.page==='onboarding'){beginOnboarding()}else{go(el.dataset.page)}return}
if(a==='close-modal'){closeModal();return}
if(a==='notifications'){showNotifications();return}
if(a==='mobile-menu'){openModal(`${modalHeader('Explore MatchSphere')}<div class="mobile-menu-grid">${nav.map(([page,label,ic])=>`<button class="btn btn-ghost" data-action="navigate" data-page="${page}">${i(ic,16)} ${esc(label)}</button>`).join('')}</div>`);return}
if(a==='community'){showCommunity(id);return}
if(a==='join'){if(joined.includes(id))joined=joined.filter(x=>x!==id);else joined.push(id);save();showCommunity(id);toast(joined.includes(id)?'Joined community in demo.':'Left community in demo.');return}
if(a==='profile-view'){showProfile(id);return}
if(a==='connect'){actConnect(id);return}
if(a==='accept'){actConnect(id);return}
if(a==='decline'){actDecline(id);closeModal();return}
if(a==='cancel'){actCancel(id);return}
if(a==='like'){likes=likes.includes(id)?likes.filter(x=>x!==id):[...likes,id];save();render();toast(likes.includes(id)?'Added to your likes. A like does not open messaging.':'Removed from your likes.');return}
if(a==='topic'){filter.topic=el.dataset.topic||'';document.querySelectorAll('.chip-btn[data-action="topic"]').forEach(x=>x.classList.toggle('selected',x.dataset.topic===filter.topic));renderDiscoverGrid();return}
if(a==='reset-filters'){resetFilters();return}
if(a==='chat-tab'){chatTab=el.dataset.tab;mobileChatOpen=false;chatEmojiOpen=false;render();return}
if(a==='chat-open'){activeChat=id;mobileChatOpen=true;chatTab='chats';render();return}
if(a==='mobile-chat-back'){mobileChatOpen=false;render();return}
if(a==='emoji'){chatEmojiOpen=!chatEmojiOpen;render();return}
if(a==='insert-emoji'){const input=document.querySelector('#message-input');if(input){input.value+=el.dataset.emoji||'';input.focus()}return}
if(a==='send-message'){sendMessage();return}
if(a==='upload-message-image'){document.querySelector('#chat-file')?.click();return}
if(a==='safety-options'){showSafetyOptions(id);return}
if(a==='report'){openReport(id);return}
if(a==='block'){openBlockConfirm(id);return}
if(a==='confirm-block'){if(!blocked.includes(id))blocked.push(id);delete connections[id];delete chats[id];save();closeModal();render();toast('Profile blocked and removed from your demo chats and discovery.');return}
if(a==='submit-report'){const reason=document.querySelector('#report-reason')?.value,details=document.querySelector('#report-details')?.value;reports.push({id,reason,details,date:new Date().toISOString()});save();closeModal();toast('Demo report saved locally. A real launch must forward reports to a moderation team.');return}
if(a==='blocked-list'){showBlocked();return}
if(a==='unblock'){blocked=blocked.filter(x=>x!==id);save();showBlocked();if(currentPage==='discover')renderDiscoverGrid();toast('Profile unblocked.');return}
if(a==='privacy'){privacy[el.dataset.setting]=!privacy[el.dataset.setting];save();render();toast('Privacy preference saved in this browser.');return}
if(a==='verification-info'){openModal(`${modalHeader('Production verification roadmap')}<p class="muted small">A public launch needs server-side email/phone one-time codes, age assurance appropriate to each jurisdiction, clear privacy disclosures, anti-fraud monitoring, and a human appeals process.</p><div class="inline-alert">A date-of-birth input by itself cannot establish or verify a person's age.</div>`);return}
if(a==='premium-info'){openModal(`${modalHeader('MatchSphere Plus · future idea')}<p class="muted small">There is no paid plan in this prototype. If introduced, premium features would be optional enhancements, never access to essential messaging, privacy, reporting, blocking, or verification.</p>`);return}
if(a==='draft-choice'){const key=el.dataset.field;draft[key]||=[];if(draft[key].includes(el.dataset.value))draft[key]=draft[key].filter(x=>x!==el.dataset.value);else draft[key].push(el.dataset.value);el.classList.toggle('chosen',draft[key].includes(el.dataset.value));el.setAttribute('aria-pressed',String(draft[key].includes(el.dataset.value)));return}
if(a==='onboard-prev'){if(onboardingStep===0)go('home');else{onboardingStep--;render()}return}
if(a==='onboard-next'){document.querySelectorAll('[data-onboard-field]').forEach(input=>draft[input.dataset.onboardField]=input.value);if(!validateStep())return;if(onboardingStep<3){onboardingStep++;render()}else{const born=new Date(draft.dob+'T12:00:00'),today=new Date();let age=today.getFullYear()-born.getFullYear();if(today.getMonth()<born.getMonth()||(today.getMonth()===born.getMonth()&&today.getDate()<born.getDate()))age--;user={...draft,age,name:draft.name.trim(),email:draft.email.trim(),consent:undefined};set('user',user);for(const c of draft.communities||[])if(!joined.includes(c))joined.push(c);save();toast('Your local demo profile is ready. Welcome to your sphere!');go('matches')}return}
}
window.addEventListener('hashchange',()=>{const p=location.hash.replace('#','')||'home';if(currentPage!==p){currentPage=p;render();window.scrollTo(0,0);if(p==='discover')renderDiscoverGrid()}});
document.addEventListener('click',actionHandler);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('#modal-root').innerHTML)closeModal();if(e.key==='Enter'&&e.target?.id==='message-input'&&!e.shiftKey){e.preventDefault();sendMessage()}});
document.addEventListener('input',e=>{if(e.target.id==='discover-search'){filter.q=e.target.value;renderDiscoverGrid()}if(e.target.matches('[data-onboard-field]'))draft[e.target.dataset.onboardField]=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='city-filter'){filter.city=e.target.value;renderDiscoverGrid()}if(e.target.id==='goal-filter'){filter.goal=e.target.value;renderDiscoverGrid()}if(e.target.id==='age-filter'){const ranges=[[22,25],[26,29],[30,35],[22,35]];[filter.ageMin,filter.ageMax]=ranges[Number(e.target.value)]||[22,35];renderDiscoverGrid()}if(e.target.matches('[data-onboard-field]'))draft[e.target.dataset.onboardField]=e.target.value;if(e.target.id==='consent-box')draft.consent=e.target.checked;if(e.target.id==='profile-upload'&&e.target.files?.[0])imageForDemo(e.target.files[0],data=>{draft.photo=data;render();toast('Profile photo added to this browser preview.')});if(e.target.id==='chat-file'&&e.target.files?.[0])imageForDemo(e.target.files[0],data=>{if(getStatus(activeChat)!=='connected')return;chats[activeChat] ||= [];chats[activeChat].push({from:'me',image:data,text:'',time:'Demo'});save();render();toast('Image added locally to demo conversation.')})});
if(user){draft={...user,interests:[...user.interests],teams:[...user.teams],communities:[...(user.communities||[])],consent:false}}
render();if(currentPage==='discover')renderDiscoverGrid();

</script>
</body>
</html>
