name: Validate MatchSphere website + native app files
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Static architecture smoke tests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          html=(root/'index.html').read_text()
          assert 'MatchSphere' in html
          assert 'id="download"' in html
          assert '/app/' not in html, 'Browser dating app is no longer allowed'
          assert not (root/'app').exists(), 'Old browser dating app must not ship'
          assert 'newsletter-form' not in html, 'Do not collect pretend waitlist emails'
          assert 'Coming soon' in html
          assert 'class="hero-portrait paper-reveal"' in html
          assert 'aria-pressed="false"' in html
          assert 'prefers-reduced-motion:reduce' in (root/'landing.css').read_text()
          assert "setFolded" in (root/'landing.js').read_text()
          assert 'id="moments"' in html
          assert all(f'id="folder-{x}"' in html for x in ['f1','music','film'])
          assert 'id="album-spread"' in html and 'id="reel"' in html
          assert 'id="typing-phrase"' in html and 'id="brand-intro"' in html
          assert 'button-glass' in html and 'aria-expanded' in html
          assert 'showAlbumPage' in (root/'landing.js').read_text()
          assert 'paintReel' in (root/'landing.js').read_text()
          assert 'prefers-reduced-motion:reduce' in (root/'landing.css').read_text()
          js=(root/'landing.js').read_text()
          assert 'newsletter-form' not in js
          assert all((root/'assets'/f'{name}.svg').is_file() for name in ['maya','aarav'])
          assert all(f'data-preview="{name}"' in html for name in ['discover','communities','messages'])
          assert 'dialog-title' in html and 'dialog.showModal()' in js
          assert 'polaroid-deck' in html and 'Shuffle the moments' in html
          assert 'connection-journey' in html and 'connection-ink' in html
          assert 'coral-motif' in html and 'footer-glass-shell' in html
          assert 'prefers-reduced-motion:reduce' in (root/'landing.css').read_text()
          assert 'setMenu(false)' in js and 'menuButton.focus()' in js
          app=json.loads((root/'mobile/app.json').read_text())
          assert app['expo']['platforms']==['ios','android']
          assert (root/'mobile/App.tsx').is_file()
          assert (root/'docs/product-boundary.md').is_file()
          print('Website/native architecture checks passed')
          PY